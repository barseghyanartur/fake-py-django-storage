name: test

on:
  push:
  pull_request:
    types: [review_requested, ready_for_review]

jobs:
  # *************************************
  # ************* Pre-commit ************
  # *************************************
  pre-commit:
    name: pre-commit ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # *************************************
  # **************** Tests **************
  # *************************************
  test:
    needs: pre-commit
    name: test py${{ matrix.python-version }}-dj${{ matrix.django-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.13", "3.12", "3.11", "3.10", "3.9"]
        django-version: ["4.2", "5.0", "5.1"]
        exclude:
          - python-version: "3.9"
            django-version: "5.0"
          - python-version: "3.9"
            django-version: "5.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: |
          base_version="${{ matrix.django-version }}"
          upper_version=$(python -c "v='$base_version'.split('.'); print(f'{v[0]}.{int(v[1])+1}')")

          # 1. Sync the environment first
          echo "--- Syncing Environment ---"
          uv sync --group all --all-extras --with "django>=$base_version,<$upper_version"

          # 2. Freeze specifically from the local .venv
          echo "--- Installed Dependencies (Project Environment) ---"
          uv pip freeze --exclude-editable

          # 3. Run tests using the synced environment
          echo "--- Running Tests ---"
          uv run pytest -vrx
        env:
          PYTEST_ADDOPTS: "-vv --durations=10"

      - name: Coveralls
        id: coveralls-setup
        continue-on-error: true
        uses: AndreMiras/coveralls-python-action@develop
        with:
          parallel: true
          flag-name: Run Tests

  # *************************************
  # ************** Coveralls ************
  # *************************************
  coveralls_finish:
    name: coveralls_finish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv pip install --system pyyaml
      - name: Coveralls Finished
        id: coveralls-finish
        continue-on-error: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: AndreMiras/coveralls-python-action@develop
        with:
          parallel-finished: true
          debug: true
