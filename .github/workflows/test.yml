name: test

on:
  push:
  pull_request:
    types: [review_requested, ready_for_review]

jobs:
  # *************************************
  # ************* Pre-commit ************
  # *************************************
  pre-commit:
    name: pre-commit ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # *************************************
  # **************** Tests **************
  # *************************************
  test:
    needs: pre-commit
    name: test py${{ matrix.python-version }}-dj${{ matrix.django-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.13", "3.12", "3.11", "3.10", "3.9"]
        django-version: ["4.2", "5.0", "5.1"]
        exclude:
          - python-version: "3.9"
            django-version: "5.0"
          - python-version: "3.9"
            django-version: "5.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: |
          # 1. Calculate Django bounds
          base_version="${{ matrix.django-version }}"
          upper_version=$(python -c "v='$base_version'.split('.'); print(f'{v[0]}.{int(v[1])+1}')")

          # 2. Define arguments once to ensure identical environment resolution
          # We use --with to inject the matrix Django version
          UV_COMMON_ARGS="--group all --all-extras --with django>=$base_version,<$upper_version"

          echo "--- Environment: Python ${{ matrix.python-version }} | Django $base_version ---"

          # 3. Use 'uv run' to execute 'uv pip freeze'
          # This ensures we are looking at the ephemeral environment uv just built
          echo "--- Installed Project Dependencies ---"
          uv run $UV_COMMON_ARGS uv pip freeze

          # 4. Run the actual tests
          echo "--- Running pytest ---"
          uv run $UV_COMMON_ARGS pytest -vrx
        env:
          PYTEST_ADDOPTS: "-vv --durations=10"
          # This variable is key: it prevents UV from looking at system site-packages
          # so your 'freeze' output will only show what you actually installed.
          UV_SYSTEM_PYTHON: 0

      - name: Coveralls
        id: coveralls-setup
        continue-on-error: true
        uses: AndreMiras/coveralls-python-action@develop
        with:
          parallel: true
          flag-name: Run Tests

  # *************************************
  # ************** Coveralls ************
  # *************************************
  coveralls_finish:
    name: coveralls_finish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        # The --break-system-packages flag allows uv to install into the
        # system Python despite the PEP 668 protection.
        run: uv pip install --system --break-system-packages pyyaml

      - name: Coveralls Finished
        id: coveralls-finish
        continue-on-error: true
        env:
          # Use the standard GITHUB_TOKEN for API calls
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: AndreMiras/coveralls-python-action@develop
        with:
          parallel-finished: true
          debug: true
